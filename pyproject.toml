[project]
name = "incident-copilot"
version = "0.1.0"
description = "An agent that investigates data-quality incidents by walking DataHub's lineage graph, narrating its reasoning live, and writing findings back to DataHub."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp<2",  # langchain-mcp-adapters 0.3.x isn't compatible with mcp 2.x yet
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "acryl-datahub>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # The web UI reads DataHub over plain GraphQL rather than paying for an MCP
    # subprocess on every nav click (see datahub_api.py). Already present via the
    # OpenAI client, but the UI depends on it directly, so declare it.
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
